api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    # Automatically redirect HTTP to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"

certificatesResolvers:
  myresolver:
    acme:
      email: sothana@storemesh.com
      storage: acme.json
      # Use the HTTP challenge
      #httpChallenge:
      #  entryPoint: web
      tlsChallenge: {}

providers:
  docker:
    exposedByDefault: false
  file:
    directory: "/rules"
    watch: true