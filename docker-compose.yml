version: '3'
networks:
    traefik:
        external: true
    internal:
        external: false

services:
    proxy:
        image: traefik:v3.6
        container_name: traefik
        restart: always
        ports:
            - "80:80"
            - "443:443"
        networks:
            - traefik
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./traefik.yml:/etc/traefik/traefik.yml:ro
            - ./acme.json:/acme.json
            - ./config-rules:/rules
        environment:
            - TZ=UTC

    db:
        container_name: ${PROJECT_NAME}-db
        image: postgres:11.3-alpine
        networks:
            - internal
        env_file:
            - .env

    backend:
        container_name: ${PROJECT_NAME}-backend
        build: ./backend
        command: sh runserver.sh
        volumes: 
            - ./backend:/backend
            - "./config-rules:/config-rules"
        networks:
            - internal
        ports: 
            - 8000:8000
        env_file: 
            - .env